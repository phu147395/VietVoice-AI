version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietvoice_web
    restart: always
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./audio_outputs:/app/audio_outputs

  nginx:
    image: nginx:alpine
    container_name: vietvoice_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_vietvoice.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
