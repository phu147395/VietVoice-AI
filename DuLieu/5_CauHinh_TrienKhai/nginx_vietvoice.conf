# Nginx Configuration cho vietvoice-ai.online
server {
    listen 80;
    server_name vietvoice-ai.online www.vietvoice-ai.online;

    # Redirect tất cả HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vietvoice-ai.online www.vietvoice-ai.online;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/vietvoice-ai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietvoice-ai.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Client body size limit cho upload audio/file ghi âm
    client_max_body_size 100M;

    # Static Files serving trực tiếp qua Nginx
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy đến Flask App (Port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (nếu sử dụng streaming audio WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts cho các request tổng hợp tiếng nói viXTTS / RVC tốn thời gian
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    error_log  /var/log/nginx/vietvoice_error.log;
    access_log /var/log/nginx/vietvoice_access.log;
}
